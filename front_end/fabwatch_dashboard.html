<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FABWATCH — FAB 2 · PHOENIX</title>
<style>
  :root {
    --bg:        #05080f;
    --panel:     #0a1020;
    --panel2:    #0b1322;
    --card:      #0c1426;
    --card2:     #0e1830;
    --border:    rgba(120,140,180,0.12);
    --border2:   rgba(120,140,180,0.22);
    --text:      #dce4f0;
    --text2:     #aeb9cc;
    --muted:     #5d6b85;
    --muted2:    #44516b;
    --teal:      #5eead4;
    --teal-dim:  #2dd4bf;
    --green:     #34d399;
    --red:       #f87171;
    --red-hot:   #fb5b5b;
    --yellow:    #fbbf24;
    --blue:      #4f8ff7;
    --mono: 'SF Mono','JetBrains Mono','Menlo','Consolas',monospace;
    --sans: -apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 13px; height: 100vh; display: flex; flex-direction: column;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); }
  .upper { text-transform: uppercase; letter-spacing: 1.4px; }

  /* ───────────── HEADER ───────────── */
  .header {
    display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 56px;
    flex-shrink: 0; border-bottom: 1px solid var(--border); background: rgba(8,12,22,0.6);
  }
  .logo-block { display: flex; align-items: center; gap: 11px; }
  .logo-mark { display: flex; align-items: center; flex-shrink: 0; color: var(--text); }
  .logo-name { font-weight: 700; font-size: 16px; letter-spacing: 1px; }
  .logo-sub { font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: 1.5px; margin-top: 1px; }

  .pipeline { display: flex; align-items: center; gap: 9px; margin-left: 200px;}
  .pipe-pill {
    font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: 1.6px;
    color: var(--text2); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 13px;
    background: rgba(255,255,255,0.015);
  }
  .pipe-pill.dim { color: var(--muted); }
  .pipe-arrow { color: var(--muted2); font-size: 13px; }

  /* Full agent pipeline (transparency view) */
  .pipe-label { font-family: var(--mono); font-size: 9px; letter-spacing: 1.6px; color: var(--muted); margin-right: 2px; }
  .pipe-stage {
    font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: 1.2px;
    color: var(--muted); border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px;
    background: rgba(255,255,255,0.015); white-space: nowrap;
    transition: color 0.25s, border-color 0.25s, box-shadow 0.25s, background 0.25s;
  }
  .pipe-stage.active {
    color: #04211c; background: var(--teal); border-color: var(--teal);
    box-shadow: 0 0 14px rgba(94,234,212,0.65); animation: pipeZap 1.1s ease-in-out;
  }
  @keyframes pipeZap {
    0%   { box-shadow: 0 0 2px rgba(94,234,212,0.2); }
    35%  { box-shadow: 0 0 22px rgba(94,234,212,0.95); }
    100% { box-shadow: 0 0 14px rgba(94,234,212,0.6); }
  }

  .hspacer { flex: 1; }
  .counts { display: flex; align-items: center; gap: 18px; }
  .count { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: var(--text2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.red { background: var(--red); box-shadow: 0 0 7px var(--red); }
  .dot.yellow { background: var(--yellow); box-shadow: 0 0 7px var(--yellow); }
  .dot.green { background: var(--green); box-shadow: 0 0 7px var(--green); }
  .dot.grey { background: #3a465e; }
  .vbar { width: 1px; height: 22px; background: var(--border2); }
  /* .clock { font-family: var(--mono); font-size: 14px; letter-spacing: 1.5px; color: var(--text); min-width: 78px; text-align: center; } */
  .btn {
    font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 1.6px;
    color: var(--text2); background: rgba(255,255,255,0.02); border: 1px solid var(--border2);
    border-radius: 9px; height: 34px; padding: 0 15px; cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn:hover { border-color: var(--teal); color: var(--text); }
  .btn.on { color: var(--teal); border-color: rgba(94,234,212,0.5); background: rgba(94,234,212,0.06); }

  /* ───────────── CRITICAL BAR ───────────── */
  .critical {
    display: flex; align-items: center; gap: 14px; padding: 11px 20px; flex-shrink: 0;
    background: linear-gradient(90deg, rgba(248,81,73,0.16), rgba(248,81,73,0.04) 55%, rgba(248,81,73,0));
    border-bottom: 1px solid rgba(248,81,73,0.25); border-top: 1px solid rgba(248,81,73,0.18);
    font-family: var(--mono); font-size: 12px;
  }
  .crit-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .crit-label { color: var(--red-hot); font-weight: 700; letter-spacing: 2px; }
  .crit-id { color: var(--muted); }
  .crit-ch { color: var(--text); font-weight: 700; }
  .crit-pc { color: var(--muted); }
  .crit-msg { color: var(--text); font-family: var(--sans); font-size: 13.5px; }
  .crit-time { margin-left: auto; color: var(--muted); }

  /* ───────────── BODY GRID ───────────── */
  .body {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 372px;
    grid-template-rows: 1fr auto; gap: 14px; padding: 14px;
  }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .plant  { grid-column: 1; grid-row: 1; }
  .trend  { grid-column: 1; grid-row: 2; }
  .errors { grid-column: 2; grid-row: 1 / span 2; }

  /* ───────────── PLANT FLOOR ───────────── */
  .plant-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 13px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .ph-left { display: flex; align-items: center; gap: 9px; }
  .ph-title { font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: 1.8px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 7px var(--green); animation: pulse 2.4s infinite; }
  .live-txt { font-family: var(--mono); font-size: 10px; letter-spacing: 1.4px; color: var(--green); }
  .plant-view-btn {
    display: flex; align-items: center; gap: 9px; justify-self: center;
    font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 1.8px;
    color: var(--teal); background: rgba(94,234,212,0.05); border: 1px solid rgba(94,234,212,0.35);
    border-radius: 10px; padding: 9px 16px; cursor: pointer; transition: all 0.15s;
  }
  .plant-view-btn:hover { background: rgba(94,234,212,0.12); border-color: var(--teal); }
  .pv-ico { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px; }
  .pv-ico i { width: 5px; height: 5px; border-radius: 1.5px; background: var(--teal); display: block; }
  .legend { display: flex; gap: 15px; justify-self: end; }
  .leg { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.2px; color: var(--muted); }

  .plant-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 1.4px; color: var(--muted2); padding: 9px 18px 0; flex-shrink: 0; }
  .floor {
    flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 0; padding: 14px 18px 18px;
    background-image: radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 24px 24px; background-position: 10px 10px;
  }

  .chamber {
    flex: 1; min-width: 0; border-radius: 16px; border: 1.5px solid var(--border2);
    background: linear-gradient(180deg, rgba(255,255,255,0.012), rgba(0,0,0,0.12));
    padding: 20px; display: flex; flex-direction: column; cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.12s;
  }
  .chamber:hover { transform: translateY(-2px); }
  .chamber.fault   { border-color: var(--red); box-shadow: 0 0 28px rgba(248,81,73,0.22), inset 0 0 40px rgba(248,81,73,0.05); }
  .chamber.nominal { border-color: rgba(94,234,212,0.55); box-shadow: 0 0 22px rgba(94,234,212,0.10); }
  .chamber.watch   { border-color: var(--yellow); box-shadow: 0 0 22px rgba(251,191,36,0.14); }
  .ch-head { display: flex; align-items: center; justify-content: space-between; }
  .ch-name { display: flex; align-items: center; gap: 11px; font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .ch-name .dot { width: 11px; height: 11px; }
  .ch-status { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 2px; }
  .ch-status.fault { color: var(--red); }
  .ch-status.nominal { color: var(--green); }
  .ch-status.watch { color: var(--yellow); }
  .ch-diagram { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px 0; }
  .ch-diagram svg { width: 100%; height: 100%; max-height: 340px; }
  .ch-foot { display: flex; align-items: flex-end; justify-content: space-between; }
  .ch-machine { font-size: 14px; color: var(--text2); }
  .ch-bay { font-family: var(--mono); font-size: 10px; letter-spacing: 1.4px; color: var(--muted); }

  .aisle { width: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .aisle::before { content: ''; position: absolute; top: 14px; bottom: 14px; width: 1px; border-left: 1px dashed var(--border2); }
  .aisle span { writing-mode: vertical-rl; font-family: var(--mono); font-size: 8.5px; letter-spacing: 3px; color: var(--muted2); background: var(--panel); padding: 8px 0; }

  /* ───────────── INCOMING ERRORS ───────────── */
  .errors-head { display: flex; align-items: center; gap: 9px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .errors-title { font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: 1.8px; }
  .err-counts { margin-left: auto; display: flex; gap: 12px; }
  .err-count { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--text2); }
  .errors-list { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 11px; }
  .err-card {
    border: 1px solid var(--border); border-left: 3px solid var(--red); border-radius: 11px;
    background: var(--card); padding: 13px 15px; cursor: pointer; transition: all 0.15s;
  }
  .err-card:hover { background: var(--card2); border-color: var(--border2); }
  .err-card.anomaly { border-left-color: var(--red); }
  .err-card.trend   { border-left-color: var(--yellow); }
  .err-card.quality { border-left-color: var(--green); }
  .err-top { display: flex; align-items: center; gap: 8px; }
  .err-ch { font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: 1px; }
  .err-pc { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .err-time { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .tag { font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.8px; padding: 3px 8px; border-radius: 6px; }
  .tag.anomaly { color: var(--teal); border: 1px solid rgba(94,234,212,0.4); background: rgba(94,234,212,0.07); }
  .tag.quality { color: var(--green); border: 1px solid rgba(52,211,153,0.4); background: rgba(52,211,153,0.07); }
  .tag.trend   { color: var(--yellow); border: 1px solid rgba(251,191,36,0.4); background: rgba(251,191,36,0.07); }
  .err-desc { font-size: 13.5px; color: var(--text); margin: 9px 0 7px; line-height: 1.45; }
  .err-id { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--muted); }

  /* ───────────── TREND WATCH ───────────── */
  .panel.trend { flex-direction: row; align-items: stretch; min-height: 108px; }
  .trend-label { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 18px 22px; border-right: 1px solid var(--border); min-width: 170px; flex-shrink: 0; }
  .trend-title { font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: 1.6px; color: var(--text2); }
  .trend-agent { font-family: var(--mono); font-size: 8.5px; letter-spacing: 1.4px; color: var(--teal); border: 1px solid rgba(94,234,212,0.3); border-radius: 6px; padding: 4px 8px; align-self: flex-start; }
  .trend-items { display: flex; flex: 1; min-width: 0; }
  .trend-item { flex: 1; min-width: 0; padding: 20px 24px; border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; gap: 13px; }
  .trend-item:last-child { border-right: none; }
  .trend-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .trend-name { font-family: var(--mono); font-size: 12px; color: var(--text2); letter-spacing: 0.5px; }
  .trend-pct { font-family: var(--mono); font-size: 19px; font-weight: 700; }
  .trend-pct.green { color: var(--green); }
  .trend-pct.yellow { color: var(--yellow); }
  .trend-pct.red { color: var(--red); }
  .trend-spark { display: flex; align-items: center; gap: 12px; }
  .trend-spark svg { flex-shrink: 0; }
  .trend-status { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }

  /* ───────────── HOVER TOOLTIP ───────────── */
  .tooltip {
    position: fixed; z-index: 60; width: 290px; pointer-events: none; opacity: 0;
    transform: translateY(6px); transition: opacity 0.13s, transform 0.13s;
    background: rgba(12,20,38,0.97); border: 1px solid rgba(94,234,212,0.4); border-radius: 13px;
    box-shadow: 0 18px 48px rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 16px;
  }
  .tooltip.show { opacity: 1; transform: translateY(0); }
  .tt-head { display: flex; align-items: center; gap: 9px; }
  .tt-name { font-family: var(--mono); font-weight: 700; font-size: 16px; letter-spacing: 1px; }
  .tt-status { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
  .tt-machine { font-size: 12.5px; color: var(--muted); margin: 5px 0 13px; }
  .tt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 16px; }
  .tt-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .kv label { display: block; font-family: var(--mono); font-size: 8.5px; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 3px; }
  .kv span { font-family: var(--mono); font-size: 13px; color: var(--text); }
  .tt-divider { height: 1px; background: var(--border); margin: 13px 0; }

  /* ───────────── MODALS ───────────── */
  .backdrop {
    position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center;
    background: rgba(3,6,12,0.72); backdrop-filter: blur(5px); padding: 30px;
  }
  .backdrop.show { display: flex; }
  .modal {
    background: #0b1322;
    border: 1px solid var(--border2); border-radius: 18px; box-shadow: 0 30px 90px rgba(0,0,0,0.7);
    max-height: calc(100vh - 88px); overflow: hidden; display: flex; flex-direction: column;
  }
  .modal.detail { width: 540px; }
  .modal.plant  { width: min(1180px, 100%); }
  .modal-head { display: flex; align-items: center; gap: 11px; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .modal-title { font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: 2px; }
  .modal-sub { font-family: var(--mono); font-size: 11px; letter-spacing: 1.4px; color: var(--muted); }
  .modal-back, .modal-x {
    width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border2);
    background: rgba(255,255,255,0.02); color: var(--text2); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .modal-x { margin-left: auto; }
  .modal-x:hover { border-color: var(--red); color: var(--red); }
  .modal-back:hover { border-color: var(--teal); color: var(--teal); }
  .modal-body { padding: 18px 20px; overflow-y: auto; }
  /* Detail modal scrolls as a single region so it always fits within the viewport. */
  .modal.detail .modal-body { overflow-y: auto; }
  .findings-scroll { max-height: none; overflow: visible; }

  .badge { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1.6px; padding: 4px 11px; border-radius: 7px; }
  .badge.fault { color: var(--red); border: 1px solid rgba(248,81,73,0.45); background: rgba(248,81,73,0.08); }
  .badge.nominal { color: var(--green); border: 1px solid rgba(52,211,153,0.45); background: rgba(52,211,153,0.08); }
  .badge.watch { color: var(--yellow); border: 1px solid rgba(251,191,36,0.45); background: rgba(251,191,36,0.08); }

  .md-title { display: flex; align-items: center; gap: 12px; }
  .md-name { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .md-machine { font-size: 13px; color: var(--muted); margin: 5px 0 14px; }
  .md-meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 16px; margin-bottom: 14px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-box { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 12px 15px; }
  .stat-box label { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 1.4px; color: var(--muted); margin-bottom: 6px; }
  .stat-box .val { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--text); }
  .stat-box .unit { font-size: 13px; color: var(--muted); font-weight: 400; }
  .findings-label { font-family: var(--mono); font-size: 11px; letter-spacing: 1.6px; color: var(--muted); margin-bottom: 14px; }

  /* Cost of Continued Run (Sustainability Agent) */
  .cost-panel { border: 1px solid rgba(248,113,113,0.4); border-radius: 13px; background: rgba(248,113,113,0.06); padding: 15px 18px; margin-bottom: 14px; }
  .cost-panel.nominal { border-color: var(--border2); background: rgba(52,211,153,0.05); }
  .cost-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .cost-title { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: var(--red); display: flex; align-items: center; gap: 9px; }
  .cost-panel.nominal .cost-title { color: var(--green); }
  .cost-ico { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid currentColor; font-size: 9px; font-weight: 700; }
  .cost-badge { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1.4px; color: var(--red); border: 1px solid rgba(248,113,113,0.5); border-radius: 7px; padding: 5px 10px; white-space: nowrap; }
  .cost-panel.nominal .cost-badge { color: var(--green); border-color: rgba(52,211,153,0.5); }
  .cost-figure { font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--red); letter-spacing: 0.5px; margin-bottom: 7px; }
  .cost-panel.nominal .cost-figure { color: var(--green); }
  .cost-per { font-size: 20px; opacity: 0.8; }
  .cost-desc { font-size: 13px; color: var(--text2); line-height: 1.5; }

  /* How to fix button */
  .fix-btn {
    width: 100%; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 1.6px;
    color: #2a0b0b; background: linear-gradient(90deg, #fb7185, #f87171); border: none; border-radius: 12px;
    padding: 13px; cursor: pointer; margin-bottom: 16px; display: flex; align-items: center;
    justify-content: center; gap: 10px; transition: filter 0.15s;
  }
  .fix-btn:hover { filter: brightness(1.08); }

  /* Resolution Playbook (Supervisor Agent) */
  .pb-cause-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .pb-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1.6px; color: var(--muted); margin-bottom: 7px; }
  .pb-cause { font-size: 17px; font-weight: 700; color: var(--text); }
  .pb-eta { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: var(--green); border: 1px solid rgba(52,211,153,0.4); border-radius: 8px; padding: 8px 13px; white-space: nowrap; flex-shrink: 0; }
  .pb-steps { display: flex; flex-direction: column; gap: 20px; margin-bottom: 22px; }
  .pb-step { display: flex; gap: 16px; align-items: flex-start; }
  .pb-num { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; color: var(--text2); }
  .pb-step-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .pb-step-desc { font-size: 13.5px; color: var(--text2); line-height: 1.5; }
  .pb-note { display: flex; gap: 11px; font-size: 12.5px; color: var(--text2); line-height: 1.5; border: 1px solid var(--border2); border-radius: 12px; padding: 16px; background: rgba(79,143,247,0.05); }
  .pb-note-ico { color: var(--blue); flex-shrink: 0; }
  .finding { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 12px; align-items: start; padding: 13px 0; border-top: 1px solid var(--border); }
  .finding:first-of-type { border-top: none; }
  .finding .fdot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
  .finding-top { display: flex; align-items: center; gap: 9px; }
  .finding-pc { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .finding-time { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .finding-desc { grid-column: 2 / 4; font-size: 13.5px; color: var(--text); line-height: 1.45; margin-top: -2px; }
  .finding-id { grid-column: 2 / 4; font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 5px; }

  /* PLANT VIEW modal */
  .pv-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.6px; color: var(--muted2); margin-bottom: 26px; }
  .pv-grid { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 60px 44px; }
  .pv-track { position: absolute; left: 6%; right: 6%; top: 50%; height: 1px; background: var(--border2); }
  .pv-track i { position: absolute; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: #2c3a57; }
  .tool {
    position: relative; border: 1px solid var(--border2); border-radius: 14px; background: rgba(255,255,255,0.012);
    padding: 18px; display: flex; flex-direction: column; gap: 13px; z-index: 1;
  }
  .tool.monitored { cursor: pointer; transition: transform 0.12s, box-shadow 0.2s; }
  .tool.monitored:hover { transform: translateY(-2px); }
  .tool.fault   { border-color: var(--red); box-shadow: 0 0 24px rgba(248,81,73,0.2); background: rgba(248,81,73,0.04); }
  .tool.nominal.monitored { border-color: rgba(94,234,212,0.5); box-shadow: 0 0 16px rgba(94,234,212,0.08); }
  .tool-head { display: flex; align-items: center; justify-content: space-between; }
  .tool-name { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-weight: 700; font-size: 16px; letter-spacing: 1px; }
  .tool-status { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 1.6px; }
  .tool-status.fault { color: var(--red); }
  .tool-status.nominal { color: var(--green); }
  .tool-status.idle { color: var(--muted); }
  .tool-icon { display: flex; justify-content: center; padding: 4px 0; }
  .tool-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tool-machine { font-size: 12.5px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-bay { font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.4px; color: var(--muted); flex-shrink: 0; }
  .pv-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.8px; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>

<!-- MODAL BACKDROP -->

<script>
/* ════════════════════════════════════════════════════════════════════════
   DATA  —  In production this is the live feed from the agents:
     · production_agent.py  → anomaly + trend findings (Anomaly tags)
     · quality_agent.py     → defect / release-gate findings (Quality tags)
   Each chamber rolls up its agent findings + current sensor snapshot.
   ════════════════════════════════════════════════════════════════════════ */
// The dashboard fetches front_end/dashboard_data.json (written by
// agents/dashboard_export.py from the live production_agent run) and re-polls
// every few seconds. DEMO is the offline fallback shown when that file isn't
// reachable (e.g. opened straight off disk via file://).
const DEMO = {
  generated_at: null,
  counts: { fault: 1, watch: 0, ok: 1 },
  critical: { id: 'ANM-4410', chamber: 'CHA', pc: 'TCP TOP PWR', text: 'TCP TOP PWR +1.00 above max', time: '14:32:46' },
  chambers: {
    CHA: {
      name: 'CHA', status: 'fault', monitored: true,
      machine: 'Multi-Chamber Etch System', bay: 'BAY 2 · ETCH',
      chamber: 'CHA', lot: 'LOT_31B', recipe: 'METAL_ETCH_A_V3', wafers: '38/43', oee: '36%', rfHrs: '1241h', workOrder: 'NONE',
      sensors: [
        { label: 'TCP TOP PWR', value: '349.5', unit: 'W', status: 'ok' },
        { label: 'PRESSURE', value: '1261.0', unit: 'mTorr', status: 'watch' },
        { label: 'RF BTM PWR', value: '133.0', unit: 'W', status: 'ok' },
        { label: 'BCl3 FLOW', value: '750.0', unit: 'sccm', status: 'ok' },
      ],
      modules: ['red', 'yellow', 'green', 'green'],
      findings: [
        { type: 'anomaly', pc: 'TCP TOP PWR', text: 'Value 361.00 outside [334–360] — fault declared', id: 'ANM-4408', time: '14:32:42' },
        { type: 'trend', pc: 'PRESSURE', text: 'PRESSURE rising — breach in 7 seconds (R²=0.94)', id: 'TRD-1101', time: '14:31:40' },
      ]
    },
    CHB: {
      name: 'CHB', status: 'nominal', monitored: true,
      machine: 'PECVD Deposition Cluster', bay: 'BAY 3 · DEPOSITION',
      chamber: 'CHB', lot: 'LOT_31B', recipe: 'METAL_ETCH_A_V3', wafers: '40/43', oee: '41%', rfHrs: '988h', workOrder: 'NONE',
      sensors: [
        { label: 'TCP TOP PWR', value: '344.2', unit: 'W', status: 'ok' },
        { label: 'PRESSURE', value: '1296.0', unit: 'mTorr', status: 'ok' },
        { label: 'RF BTM PWR', value: '133.0', unit: 'W', status: 'ok' },
        { label: 'BCl3 FLOW', value: '751.0', unit: 'sccm', status: 'ok' },
      ],
      modules: ['green', 'green', 'green', 'green'],
      findings: []
    }
  },
  errors: [
    { chamber: 'CHA', pc: 'TCP TOP PWR', type: 'anomaly', text: 'TCP TOP PWR out of range — +1.00 above max', id: 'ANM-4408', time: '14:32:42' },
    { chamber: 'CHA', pc: 'BCl3 FLOW', type: 'anomaly', text: 'BCl3 FLOW out of range — -15.53 below min', id: 'ANM-4405', time: '14:31:55' },
  ],
  trends: [
    { label: 'CHA · PRESSURE', pct: 60, tone: 'yellow', status: 'rising — monitoring',
      data: [1196,1195,1198,1196,1195,1197,1211,1261] },
    { label: 'CHB · PRESSURE', pct: 49, tone: 'green', status: 'rising — monitoring',
      data: [1201,1199,1200,1202,1201,1203,1217,1296] },
  ],
  tools: [
    { id: 'CHA',     status: 'fault',   monitored: true,  machine: 'Multi-Chamber Etch System', bay: 'BAY 2' },
    { id: 'EFEM-LP1',status: 'idle',    monitored: false, machine: 'EFEM Load Port',            bay: 'BAY 2' },
    { id: 'CHB',     status: 'nominal', monitored: true,  machine: 'PECVD Deposition Cluster',  bay: 'BAY 3' },
    { id: 'MET-1',   status: 'nominal', monitored: false, machine: 'Metrology / CD-SEM',        bay: 'BAY 3' },
    { id: 'AMHS-S2', status: 'nominal', monitored: false, machine: 'AMHS Stocker',              bay: 'AISLE' },
    { id: 'WB-2',    status: 'nominal', monitored: false, machine: 'Wet Bench Clean',           bay: 'BAY 3' },
  ]
};

let state = DEMO;

const STATUS_COLOR = { fault: 'var(--red)', nominal: 'var(--green)', watch: 'var(--yellow)', idle: 'var(--muted)' };
const STATUS_TEXT  = { fault: 'FAULT', nominal: 'NOMINAL', watch: 'WATCH', idle: 'IDLE' };

/* ───────────── SVG: big chamber diagram ───────────── */
function moduleColor(tone) {
  if (tone === 'green') return '#34d399';
  if (tone === 'red')   return '#f87171';
  if (tone === 'yellow')return '#fbbf24';
  return '#2c3a57';
}
function procModule(cx, cy, tone) {
  const c = moduleColor(tone);
  const fill = tone === 'idle' ? 'rgba(255,255,255,0.012)'
    : tone === 'red' ? 'rgba(248,113,113,0.08)'
    : tone === 'yellow' ? 'rgba(251,191,36,0.07)'
    : 'rgba(52,211,153,0.06)';
  const glow = (tone === 'red')
    ? `<rect x="${cx-32}" y="${cy-27}" width="64" height="54" rx="15" fill="none" stroke="${c}" stroke-width="1" opacity="0.0"><animate attributeName="opacity" values="0;0.5;0" dur="1.6s" repeatCount="indefinite"/></rect>` : '';
  return `
    ${glow}
    <rect x="${cx-29}" y="${cy-24}" width="58" height="48" rx="13" fill="${fill}" stroke="${c}" stroke-width="1.6"/>
    <circle cx="${cx}" cy="${cy}" r="14" fill="none" stroke="${c}" stroke-width="1.4" opacity="0.85"/>
    <circle cx="${cx}" cy="${cy}" r="4.5" fill="${c}"/>`;
}
function bigDiagram(ch) {
  const m = ch.modules;
  const line = (x1,y1,x2,y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#223049" stroke-width="2" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 300 250" preserveAspectRatio="xMidYMid meet">
    ${line(120,72,93,55)} ${line(180,72,207,55)}
    ${line(108,108,73,124)} ${line(192,108,227,124)}
    ${line(140,144,134,162)} ${line(160,144,166,162)}
    ${line(134,182,118,196)} ${line(166,182,182,196)}
    <polygon points="128,72 172,72 194,108 172,144 128,144 106,108" fill="rgba(15,22,40,0.55)" stroke="#2c3a57" stroke-width="1.6"/>
    <line x1="150" y1="92" x2="150" y2="118" stroke="#3a4a68" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="108" r="5" fill="none" stroke="#3a4a68" stroke-width="1.5"/>
    <circle cx="150" cy="88" r="3" fill="#3a4a68"/>
    ${procModule(64, 55, m[0])}
    ${procModule(236, 55, m[1])}
    ${procModule(48, 124, m[2])}
    ${procModule(252, 124, m[3])}
    <rect x="118" y="162" width="26" height="20" rx="6" fill="rgba(255,255,255,0.015)" stroke="#2c3a57" stroke-width="1.3"/>
    <rect x="156" y="162" width="26" height="20" rx="6" fill="rgba(255,255,255,0.015)" stroke="#2c3a57" stroke-width="1.3"/>
    <rect x="70" y="198" width="160" height="30" rx="9" fill="rgba(255,255,255,0.012)" stroke="#2c3a57" stroke-width="1.4"/>
    <rect x="92"  y="194" width="18" height="11" rx="3" fill="rgba(11,19,34,1)" stroke="#2c3a57" stroke-width="1"/>
    <rect x="141" y="194" width="18" height="11" rx="3" fill="rgba(11,19,34,1)" stroke="#2c3a57" stroke-width="1"/>
    <rect x="190" y="194" width="18" height="11" rx="3" fill="rgba(11,19,34,1)" stroke="#2c3a57" stroke-width="1"/>
    <text x="150" y="217" text-anchor="middle" fill="#46546e" font-family="monospace" font-size="9.5" letter-spacing="3">EFEM</text>
  </svg>`;
}

/* ───────────── SVG: top-down tool icon (plant view) ───────────── */
function toolIcon(status) {
  const c = STATUS_COLOR[status];
  const stroke = status === 'idle' ? '#2c3a57' : c;
  const tint = status === 'fault' ? 'rgba(248,113,113,0.06)' : status === 'nominal' ? 'rgba(52,211,153,0.05)' : 'rgba(255,255,255,0.012)';
  return `<svg width="120" height="74" viewBox="0 0 120 74">
    <rect x="20" y="10" width="80" height="48" rx="11" fill="${tint}" stroke="${stroke}" stroke-width="1.6"/>
    <rect x="10" y="24" width="12" height="20" rx="3" fill="${tint}" stroke="${stroke}" stroke-width="1.4"/>
    <rect x="98" y="24" width="12" height="20" rx="3" fill="${tint}" stroke="${stroke}" stroke-width="1.4"/>
    <ellipse cx="60" cy="34" rx="22" ry="13" fill="none" stroke="${stroke}" stroke-width="1.4" opacity="0.8"/>
    <circle cx="60" cy="34" r="5" fill="${c}"/>
  </svg>`;
}

/* ───────────── SVG: sparkline ───────────── */
function sparkline(data, tone, w, h) {
  const color = tone === 'green' ? '#34d399' : tone === 'yellow' ? '#fbbf24' : '#f87171';
  const mn = Math.min(...data), mx = Math.max(...data), rng = (mx - mn) || 1;
  const pts = data.map((v,i) => `${((i/(data.length-1))*w).toFixed(1)},${(h-((v-mn)/rng)*(h-4)-2).toFixed(1)}`).join(' ');
  const lx = w, ly = (h-((data[data.length-1]-mn)/rng)*(h-4)-2).toFixed(1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="2.4" fill="${color}"/>
  </svg>`;
}

/* ───────────── RENDER ───────────── */
function renderCritical() {
  const el = document.getElementById('critical');
  const c = state.critical;
  if (!c) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = `
    <span class="crit-dot"></span>
    <span class="crit-label">CRITICAL</span>
    <span class="crit-id">${c.id}</span>
    <span class="crit-ch">${c.chamber}</span>
    <span class="crit-pc">${c.pc}</span>
    <span class="crit-msg">${c.text}</span>
    <span class="crit-time">${c.time}</span>`;
}

function renderChambers() {
  const order = Object.keys(state.chambers);
  document.getElementById('floor').innerHTML = order.map((key, i) => {
    const ch = state.chambers[key];
    const card = `
      <div class="chamber ${ch.status}" data-ch="${key}">
        <div class="ch-head">
          <div class="ch-name">${ch.name} <span class="dot ${ch.status === 'fault' ? 'red' : ch.status === 'watch' ? 'yellow' : 'green'}"></span></div>
          <div class="ch-status ${ch.status}">${STATUS_TEXT[ch.status]}</div>
        </div>
        <div class="ch-diagram">${bigDiagram(ch)}</div>
        <div class="ch-foot">
          <div class="ch-machine">${ch.machine}</div>
          <div class="ch-bay">${ch.bay}</div>
        </div>
      </div>`;
    return i === 0 ? card + `<div class="aisle"><span>SERVICE AISLE</span></div>` : card;
  }).join('');

  document.querySelectorAll('.chamber').forEach(el => {
    const key = el.dataset.ch;
    el.addEventListener('mouseenter', e => showTooltip(key, e));
    el.addEventListener('mousemove', e => moveTooltip(e));
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('click', () => { hideTooltip(); openDetail(key); });
  });
}

function renderErrors() {
  const errors = state.errors || [];
  document.getElementById('errorsList').innerHTML = errors.map(e => `
    <div class="err-card ${e.type}" data-id="${e.id}" data-ch="${e.chamber}">
      <div class="err-top">
        <span class="err-ch">${e.chamber}</span>
        <span class="err-pc">${e.pc}</span>
        <span class="tag ${e.type}">${e.type === 'anomaly' ? 'Anomaly' : e.type === 'quality' ? 'Quality' : 'Trend'}</span>
        <span class="err-time">${e.time}</span>
      </div>
      <div class="err-desc">${e.text}</div>
      <div class="err-id">${e.id}</div>
    </div>`).join('');
  document.getElementById('err-red').textContent = errors.filter(e => e.type === 'anomaly').length;
  document.getElementById('err-yellow').textContent = errors.filter(e => e.type === 'trend').length;
  document.querySelectorAll('.err-card').forEach(el => {
    el.addEventListener('click', () => { if (state.chambers[el.dataset.ch]) openDetail(el.dataset.ch); });
  });
}

function renderTrends() {
  document.getElementById('trendItems').innerHTML = (state.trends || []).map(t => `
    <div class="trend-item">
      <div class="trend-top">
        <span class="trend-name">${t.label}</span>
        <span class="trend-pct ${t.tone}">${t.pct}%</span>
      </div>
      <div class="trend-spark">
        ${sparkline(t.data, t.tone, 110, 28)}
        <span class="trend-status">${t.status}</span>
      </div>
    </div>`).join('');
}

/* ───────────── HOVER TOOLTIP ───────────── */
const tt = document.getElementById('tooltip');
function showTooltip(key, e) {
  const ch = state.chambers[key];
  const col = STATUS_COLOR[ch.status];
  const mini = (ch.sensors || []).slice(0, 3).map(s =>
    `<div class="kv"><label>${s.label}</label><span>${s.value} ${s.unit}</span></div>`).join('');
  tt.innerHTML = `
    <div class="tt-head">
      <span class="tt-name">${ch.name}</span>
      <span class="dot" style="background:${col};box-shadow:0 0 7px ${col};"></span>
      <span class="tt-status" style="color:${col};">${STATUS_TEXT[ch.status]}</span>
    </div>
    <div class="tt-machine">${ch.machine}</div>
    <div class="tt-grid">
      <div class="kv"><label>CHAMBER</label><span>${ch.chamber}</span></div>
      <div class="kv"><label>LOT</label><span>${ch.lot}</span></div>
      <div class="kv"><label>RECIPE</label><span>${ch.recipe}</span></div>
      <div class="kv"><label>WAFERS</label><span>${ch.wafers}</span></div>
    </div>
    <div class="tt-divider"></div>
    <div class="tt-grid three">${mini}</div>`;
  tt.classList.add('show');
  moveTooltip(e);
}
function moveTooltip(e) {
  const pad = 16, w = 290, h = tt.offsetHeight || 230;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > window.innerWidth - 10) x = e.clientX - w - pad;
  if (y + h > window.innerHeight - 10) y = window.innerHeight - h - 10;
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
}
function hideTooltip() { tt.classList.remove('show'); }

/* ───────────── MODALS ───────────── */
const backdrop = document.getElementById('backdrop');
const mount = document.getElementById('modalMount');

function openModal(html, cls) {
  mount.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  backdrop.classList.add('show');
  mount.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
}
function closeModal() { backdrop.classList.remove('show'); mount.innerHTML = ''; }
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function openDetail(key) {
  const ch = state.chambers[key];
  if (!ch) return;
  const col = STATUS_COLOR[ch.status];
  const statBoxes = (ch.sensors || []).map(s =>
    `<div class="stat-box"><label>${s.label}</label><div class="val">${s.value} <span class="unit">${s.unit}</span></div></div>`).join('');
  const noFindings = !ch.findings || ch.findings.length === 0;
  const findings = ch.findings.map(f => {
    const fc = f.type === 'anomaly' ? 'var(--teal)' : f.type === 'quality' ? 'var(--green)' : 'var(--yellow)';
    const label = f.type === 'anomaly' ? 'Anomaly' : f.type === 'quality' ? 'Quality' : 'Trend';
    return `
      <div class="finding">
        <span class="fdot" style="background:${fc};box-shadow:0 0 6px ${fc};"></span>
        <div class="finding-top">
          <span class="tag ${f.type}">${label}</span>
          <span class="finding-pc">${f.pc}</span>
        </div>
        <span class="finding-time">${f.time}</span>
        <div class="finding-desc">${f.text}</div>
        <div class="finding-id">${f.id}</div>
      </div>`;
  }).join('');
  // Cost of Continued Run — output of the Sustainability Agent.
  // PLACEHOLDER for now (ch.sustainability); wired to the real agent later.
  const cost = ch.sustainability || placeholderCost(ch);
  const costHtml = `
    <div class="cost-panel ${cost.level === 'nominal' ? 'nominal' : ''}">
      <div class="cost-head">
        <span class="cost-title"><span class="cost-ico">$</span> COST OF CONTINUED RUN</span>
        <span class="cost-badge">${cost.badge}</span>
      </div>
      <div class="cost-figure">${cost.figure} <span class="cost-per">${cost.per}</span></div>
      <div class="cost-desc">${cost.desc}</div>
    </div>`;
  openModal(`
    <div class="modal-head">
      <span class="dot" style="background:${col};box-shadow:0 0 7px ${col};"></span>
      <span class="modal-title">MACHINE DETAIL</span>
      <button class="modal-x" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div class="md-title">
        <span class="md-name">${ch.name}</span>
        <span class="badge ${ch.status}">${STATUS_TEXT[ch.status]}</span>
      </div>
      <div class="md-machine">${ch.machine}</div>
      <div class="md-meta">
        <div class="kv"><label>CHAMBER</label><span>${ch.chamber}</span></div>
        <div class="kv"><label>LOT</label><span>${ch.lot}</span></div>
        <div class="kv"><label>WAFERS</label><span>${ch.wafers}</span></div>
        <div class="kv"><label>RECIPE</label><span>${ch.recipe}</span></div>
        <div class="kv"><label>OEE</label><span>${ch.oee}</span></div>
        <div class="kv"><label>WORK ORDER</label><span style="color:${ch.workOrder && ch.workOrder !== 'NONE' ? 'var(--red)' : 'var(--text)'};">${ch.workOrder}</span></div>
      </div>
      <div class="stat-grid">${statBoxes}</div>
      ${costHtml}
      <button class="fix-btn" data-fix>🔧 HOW TO FIX THIS ANOMALY</button>
      <div class="findings-label">AGENT FINDINGS</div>
      <div class="findings-scroll">${noFindings ? '<div style="font-family:var(--mono);font-size:11px;color:var(--muted);">No active findings — chamber nominal.</div>' : findings}</div>
    </div>`, 'detail');
  const fixBtn = mount.querySelector('[data-fix]');
  if (fixBtn) fixBtn.addEventListener('click', () => openPlaybook(key));
}

// PLACEHOLDER — replaced later by the Sustainability Agent output (ch.sustainability).
function placeholderCost(ch) {
  if (ch.status === 'fault')
    return { level: 'critical', figure: '$30,800', per: '/ hr', badge: 'CRITICAL EXPOSURE',
             desc: `Running ${ch.name} in fault risks scrapping the active lot plus unplanned downtime and rework. Yield loss compounds across queued lots for every hour of delay.` };
  if (ch.status === 'watch')
    return { level: 'watch', figure: '$8,400', per: '/ hr', badge: 'ELEVATED EXPOSURE',
             desc: `${ch.name} is trending toward a control limit. Continued operation risks rework on the current lot if the drift is not corrected.` };
  return { level: 'nominal', figure: '$0', per: '/ hr', badge: 'NO EXPOSURE',
           desc: `${ch.name} is running within limits — no cost exposure from continued operation.` };
}

// PLACEHOLDER — replaced later by the Supervisor Agent output (ch.playbook).
function placeholderPlaybook(ch) {
  return {
    cause: 'Process parameter drift',
    eta: '20–35 min',
    steps: [
      { title: 'Place tool in safe idle', desc: `Pause wafer handoff on ${ch.chamber || ch.name} before intervention.` },
      { title: 'Review the trend', desc: 'Open the parameter trend and identify which signal crossed its control limit.' },
      { title: 'Correct the deviation', desc: 'Recalibrate the affected subsystem against the recipe baseline.' },
      { title: 'Verify & release', desc: 'Confirm the parameter holds within limits for 3 cycles, then release the lot.' },
    ],
    note: 'Log the corrective action in the MES once complete. If the anomaly recurs within the same shift, escalate to the maintenance lead and open a work order.',
  };
}

function openPlaybook(key) {
  const ch = state.chambers[key];
  if (!ch) return;
  const pb = ch.playbook || placeholderPlaybook(ch);
  const steps = pb.steps.map((s, i) => `
    <div class="pb-step">
      <span class="pb-num">${i + 1}</span>
      <div class="pb-step-body">
        <div class="pb-step-title">${s.title}</div>
        <div class="pb-step-desc">${s.desc}</div>
      </div>
    </div>`).join('');
  openModal(`
    <div class="modal-head">
      <button class="modal-back" data-back title="Back to machine detail">←</button>
      <span class="modal-title">🔧 RESOLUTION PLAYBOOK</span>
      <span class="modal-sub">${ch.name}</span>
      <button class="modal-x" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div class="pb-cause-row">
        <div>
          <div class="pb-label">LIKELY CAUSE</div>
          <div class="pb-cause">${pb.cause}</div>
        </div>
        <span class="pb-eta">Est. ${pb.eta}</span>
      </div>
      <div class="pb-steps">${steps}</div>
      <div class="pb-note"><span class="pb-note-ico">ⓘ</span><span>${pb.note}</span></div>
    </div>`, 'detail');
  const back = mount.querySelector('[data-back]');
  if (back) back.addEventListener('click', () => openDetail(key));   // revert to machine detail
}

/* ───────────── PIPELINE TRANSPARENCY (header) ─────────────
   Highlights the active agent as the chain runs. PLACEHOLDER driver: sweeps
   through the stages to show the pipeline "working". When the agents are wired
   in, drive this from real per-agent events — call setPipelineStage(name) as
   each agent starts, and setPipelineIdle() when the chain is done. */
const PIPELINE_STAGES = ['production', 'quality', 'maintenance', 'sop', 'sustainability', 'supervisor'];
function setPipelineStage(name) {
  document.querySelectorAll('.pipe-stage').forEach(el =>
    el.classList.toggle('active', el.dataset.stage === name));
}
function setPipelineIdle() {
  document.querySelectorAll('.pipe-stage').forEach(el => el.classList.remove('active'));
}
let _pipeIdx = 0;
function tickPipeline() {
  setPipelineStage(PIPELINE_STAGES[_pipeIdx % PIPELINE_STAGES.length]);
  _pipeIdx++;
}
tickPipeline();
setInterval(tickPipeline, 1100);

function openPlantView() {
  const cards = (state.tools || []).map(t => {
    const cls = `tool ${t.status}${t.monitored ? ' monitored' : ''}`;
    const col = STATUS_COLOR[t.status];
    return `
      <div class="${cls}" ${t.monitored ? `data-ch="${t.id}"` : ''}>
        <div class="tool-head">
          <div class="tool-name">${t.id} <span class="dot" style="background:${col};box-shadow:0 0 7px ${col};"></span></div>
          <div class="tool-status ${t.status}">${STATUS_TEXT[t.status]}</div>
        </div>
        <div class="tool-icon">${toolIcon(t.status)}</div>
        <div class="tool-foot">
          <span class="tool-machine">${t.machine}</span>
          <span class="tool-bay">${t.bay}</span>
        </div>
      </div>`;
  }).join('');
  const faults = (state.tools || []).filter(t => t.monitored && t.status === 'fault').map(t => t.id);
  openModal(`
    <div class="modal-head">
      <span class="live-dot"></span>
      <span class="modal-title">LIVE VIEW</span>
      <span class="modal-sub">FAB 2 · TOP-DOWN PLANT FLOOR</span>
      <button class="modal-x" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div class="pv-sub">PROCESS BAY 2 — 3 · AISLE ROUTING</div>
      <div class="pv-grid">
        <div class="pv-track"><i style="left:16%"></i><i style="left:50%"></i><i style="left:84%"></i></div>
        ${cards}
      </div>
      <div class="pv-foot">
        <span>${faults.length} monitored tool${faults.length === 1 ? '' : 's'} in fault — ${faults.join(', ') || 'none'}</span>
        <span>Click a monitored tool (CHA / CHB) to open its detail</span>
      </div>
    </div>`, 'plant');
  mount.querySelectorAll('.tool.monitored').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.ch));
  });
}
document.getElementById('plantViewBtn').addEventListener('click', openPlantView);

setInterval(tick, 1000); tick(); */ 

document.getElementById('pauseBtn').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? 'RESUME' : 'PAUSE';
  this.classList.toggle('on', paused);
});
document.getElementById('soundBtn').addEventListener('click', function() {
  const on = this.classList.toggle('on');
  this.textContent = on ? 'SOUND ON' : 'SOUND OFF';
});

/* ───────────── DATA LOADING ───────────── */
function renderAll() {
  renderCritical();
  renderChambers();
  renderErrors();
  renderTrends();
}

const DATA_URL = 'dashboard_data.json';
let liveConnected = false;

async function loadData() {
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json && json.chambers) {
      state = json;
      liveConnected = true;
      renderAll();
    }
  } catch (err) {
    // No JSON reachable (e.g. opened via file://) — keep showing DEMO data.
    if (!liveConnected) console.info('[fabwatch] no live data feed — showing demo data.', err.message);
  }
}

/* ───────────── INIT ───────────── */
renderAll();        // paint immediately with DEMO so the page is never blank
loadData();         // then try to replace it with the live agent feed
setInterval(loadData, 5000);   // auto-refresh
</script>
